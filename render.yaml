services:
  - type: web
    name: buddhavest
    runtime: python
    rootDir: assets/1BuddhaVest
    buildCommand: pip install -r requirements.txt
    # ONE worker, deliberately. Two would double memory on a 512MB instance
    # (each Python process loads pandas + yfinance, ~150-250MB), and an OOM
    # restart loop is worse than the problem it was meant to soften.
    #
    # The hang is fixed at the source instead: every Yahoo call is now bounded
    # by _YF_TIMEOUT in data_fetcher.py, so no request can occupy the worker
    # indefinitely. That is the actual fix; a second worker was only padding.
    # --timeout-keep-alive 30: don't hold idle sockets open on a small instance.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Where the last-known-good market data is kept. It used to live in /tmp,
      # which Render wipes on every deploy — so the safety net that fills missing
      # volume and market-cap values was destroyed by each release, exactly when
      # it was needed. Point this at a mounted disk to make it survive.
      #
      # Uncomment the `disk:` block below once on a paid plan ($0.25/GB/month).
      # Until then the server logs "EPHEMERAL — wiped on every deploy" at startup
      # so the limitation is visible rather than silent.
      # - key: LKG_DIR
      #   value: /var/data
    # disk:
    #   name: buddhavest-data
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # Both blocks are commented together on purpose. Setting LKG_DIR without an
    # actual mounted disk would point at an ordinary container directory that is
    # ALSO wiped on deploy, while the startup log claimed "persistent" — a false
    # reassurance, which is worse than the honest warning it replaces.
