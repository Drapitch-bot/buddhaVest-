services:
  - type: web
    name: buddhavest
    runtime: python
    rootDir: assets/1BuddhaVest
    buildCommand: pip install -r requirements.txt
    # --workers 2: with a single worker, ONE slow upstream call blocked every
    #   other request on the whole service. Seen live: /status (which never
    #   touches Yahoo) answered instantly while /analyze and /quotes both hung.
    #   A second worker keeps the app answering while the first is stuck.
    # --timeout-keep-alive 30: don't hold idle sockets open on a small instance.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
