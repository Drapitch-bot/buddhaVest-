services:
  - type: web
    name: buddhavest
    runtime: python
    buildCommand: pip install -r requirements.txt
    # ONE worker, deliberately. Two would double memory on a 512MB instance
    # (each Python process loads pandas + yfinance, ~150-250MB), and an OOM
    # restart loop is worse than the problem it was meant to soften.
    #
    # The hang is fixed at the source instead: every Yahoo call is now bounded
    # by _YF_TIMEOUT in data_fetcher.py, so no request can occupy the worker
    # indefinitely. That is the actual fix; a second worker was only padding.
    # --timeout-keep-alive 30: don't hold idle sockets open on a small instance.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
