services:
  - type: web
    name: buddhavest
    runtime: python
    buildCommand: pip install -r requirements.txt
    # ONE worker, deliberately. Two would double memory on a 512MB instance
    # (each Python process loads pandas + yfinance, ~150-250MB), and an OOM
    # restart loop is worse than the problem it was meant to soften.
    #
    # The hang is fixed at the source instead: every Yahoo call is now bounded
    # by _YF_TIMEOUT in data_fetcher.py, so no request can occupy the worker
    # indefinitely. That is the actual fix; a second worker was only padding.
    # --timeout-keep-alive 30: don't hold idle sockets open on a small instance.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # ── Last-known-good store ───────────────────────────────────────────────
      # Holds the most recent non-null volume, average volume and market cap per
      # ticker. It is what keeps the market table populated when Yahoo answers
      # with a price and nothing else.
      #
      # It lived in /tmp, which Render wipes on EVERY deploy — so the safety net
      # was destroyed by each release, at precisely the moment it was needed.
      #
      # Now backed by Upstash Redis (free tier), which lives outside the
      # container and therefore survives deploys. Set these two in the Render
      # dashboard (Environment tab) — NOT here, they are credentials:
      #
      #     UPSTASH_REDIS_REST_URL     https://<your-db>.upstash.io
      #     UPSTASH_REDIS_REST_TOKEN   <the REST token from the Upstash console>
      #
      # With both set, startup logs:
      #     [startup] LKG store: Upstash Redis (persistent — survives deploys)
      # With either missing it falls back to /tmp and logs:
      #     [startup] LKG store: /tmp/... (EPHEMERAL — wiped on every deploy)
      #
      # Writes are coalesced to at most one every 60 seconds (see
      # _lkg_flush_loop), so traffic cannot push this past the free tier.
      #
      # A mounted disk also works if you ever move to a paid plan — set LKG_DIR
      # to the mount path. Redis takes precedence when both are configured.
      #
      # Nothing is declared here for it on purpose: both values are credentials,
      # and a token committed to the repo is a token that has to be rotated.
